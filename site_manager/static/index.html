<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RMF robots</title>
<link rel="icon" type="image/svg+xml" href="/isaacbot-mark-black.svg" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/svg+xml" href="/isaacbot-mark-white.svg" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<link rel="stylesheet" href="/common.css">
</head>
<body>
<div id="site-header"></div>
<main>
  <div class="page-title">
    <h1>Robots</h1>
    <span class="spacer"></span>
    <span class="status rmf-status" id="rmf"><span class="dot"></span><span>…</span></span>
  </div>
  <section>
    <p class="muted" style="margin-top:0">The fleet's isaacbots. Open one for its maps and the RMF
      sites. Each has its own VDA 5050 identity (topics
      <code>uagv/v2/&lt;manufacturer&gt;/&lt;serial&gt;/…</code>) and a broker login that may only use
      those topics. Adding or removing a robot restarts RMF (about 10 s).</p>
    <div id="robots">Loading…</div>
    <form id="add-robot" class="add-robot" autocomplete="off">
      <label>RMF name <input type="text" id="robot-name" placeholder="ardennes_003" size="14" required></label>
      <label>Serial number <input type="text" id="robot-serial" placeholder="ardennis-3420987-f" size="20" required></label>
      <label>Manufacturer <input type="text" id="robot-manufacturer" value="IsaacBot" size="12" required></label>
      <label>Charger <select id="robot-charger"><option value="">site charger</option></select></label>
      <label title="Where its saved maps are read from; empty for a robot without maps (simulation)">
        SSH (optional) <input type="text" id="robot-ssh" placeholder="root@192.168.1.201:24" size="20"></label>
      <button class="primary" type="submit">Add robot</button>
    </form>
    <div id="robot-result"></div>
  </section>
</main>
<div id="site-footer"></div>

<script src="/common.js"></script>
<script>
siteChrome();

function renderRobots(data) {
  setHtml('robots', !data.robots.length ? '<p class="muted">No robots.</p>' :
    `<table><thead><tr><th>Robot</th><th>VDA 5050 identity</th><th>Broker login</th><th>Charger</th><th>State</th><th></th></tr></thead><tbody>` +
    data.robots.map((r) => `<tr><td><a class="robot-link" href="/robots/${encodeURIComponent(r.name)}">${esc(r.name)}</a></td>
        <td><code>${esc(r.manufacturer)} / ${esc(r.serial_number)}</code></td>
        <td>${data.broker_auth ? `<code>${esc(r.broker_login)}</code>` : '<span class="muted">none (anonymous broker)</span>'}</td>
        <td>${r.charger ? esc(r.charger) : `<span class="muted">site charger${data.site_charger ? ` (${esc(data.site_charger)})` : ''}</span>`}</td>
        <td>${robotState(r)}</td>
        <td><div class="actions">
          ${data.broker_auth ? `<button data-robot-password="${esc(r.name)}">New password</button>` : ''}
          <button class="danger" data-robot-delete="${esc(r.name)}" ${data.robots.length < 2 ? 'disabled title="The fleet needs at least one robot"' : ''}>Remove</button>
        </div></td></tr>`).join('') + '</tbody></table>');
  setHtml('robot-charger', '<option value="">site charger</option>' +
    data.waypoints.map((w) => `<option>${esc(w)}</option>`).join(''));
}

async function refresh() {
  try {
    renderRmf(await api('GET', '/api/status'));
    renderRobots(await api('GET', '/api/robots'));
  } catch (e) {
    setHtml('rmf', `<span class="dot bad"></span><span>Site manager unreachable: ${esc(e.message)}</span>`);
  }
}

$('add-robot').addEventListener('submit', async (event) => {
  event.preventDefault();
  const body = {name: $('robot-name').value.trim(), serial_number: $('robot-serial').value.trim(),
                manufacturer: $('robot-manufacturer').value.trim(), charger: $('robot-charger').value,
                ssh: $('robot-ssh').value.trim()};
  $('robot-result').innerHTML = '';
  try {
    showCredentials('robot-result', await api('POST', '/api/robots', body), 'added; RMF restarts with it now');
    $('robot-name').value = ''; $('robot-serial').value = ''; $('robot-ssh').value = '';
    await refresh();
  } catch (e) {
    $('robot-result').innerHTML = `<div class="message bad">Could not add <b>${esc(body.name)}</b>: ${esc(e.message)}</div>`;
  }
});

onButtons({
  robotPassword: async (b, name) => {
    if (!confirm(`Give ${name} a new broker password? It is offline until its balena variable has the new one.`)) return;
    showCredentials('robot-result', await api('POST', `/api/robots/${encodeURIComponent(name)}/password`), 'has a new password');
  },
  robotDelete: async (b, name) => {
    if (!confirm(`Remove ${name}? Its broker login stops working and RMF restarts without it.`)) return;
    await api('DELETE', `/api/robots/${encodeURIComponent(name)}`);
    $('robot-result').innerHTML = ''; await refresh();
  },
});

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
