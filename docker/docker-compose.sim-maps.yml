# Simulated isaacbot in indoor mode: the RMF sites page reads the maps start_sim_isaacbot.sh
# --localization indoor saves in ~/isaacbot_amr_maps (its --maps-dir), instead of the isaacbot's over ssh.
#
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.sim-maps.yml up -d
#
# Sites imported this way still point at the isaacbot's broker unless ISAACBOT_AMR_BROKER says otherwise;
# the simulated isaacbot's connector uses this stack's mosquitto.
services:
  site-manager:
    environment:
      MAPS_DIR: /isaacbot_amr_maps
      ISAACBOT_AMR_BROKER: mosquitto:1883
    volumes:
      - ${ISAACBOT_AMR_MAPS_DIR:-~/isaacbot_amr_maps}:/isaacbot_amr_maps:ro
