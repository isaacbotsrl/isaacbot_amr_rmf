# Server deployment: RMF + the fleet's MQTT broker on a host reached over WireGuard.
# Use it through docker/rmf-server.sh, which adds this file and server/.env:
#
#   docker/rmf-server.sh init            # once: generates server/.env + the broker logins
#   docker/rmf-server.sh up -d --build
#
# Everything is published on RMF_BIND_IP only (default 10.8.0.1, the server's WireGuard
# address), never on the server's LAN. `!override` replaces the base file's ports instead of
# adding to them.
#
# The broker requires a login (mosquitto.server.conf). The logins and ACL live in the
# broker-auth volume, seeded on first start from server/mosquitto.passwd and mosquitto.acl:
#   rmf       this stack's fleet adapter, all of uagv/#
#   <robot>   one per isaacbot, only its own uagv/v2/<manufacturer>/<serial>/# (Ardennes: ardennes)
# Robots are added and removed on the sites page (:8020, Robots), which writes the logins, the
# ACL and robots.json; mosquitto-run.sh reloads the broker, run_rmf.sh restarts RMF. The page
# shows the new robot's balena variables (password included) once.
# RMF uses this broker for every site, whatever the site's fleet config names.
services:
  mosquitto:
    command: [sh, /mosquitto/run.sh]
    volumes: !override
      - ./mosquitto.server.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto-run.sh:/mosquitto/run.sh:ro
      - ./mosquitto.acl:/mosquitto/seed/acl:ro
      - ./server/mosquitto.passwd:/mosquitto/seed/passwd:ro
      - broker-auth:/mosquitto/auth
      - mosquitto-data:/mosquitto/data
    ports: !override
      - "${RMF_BIND_IP:-10.8.0.1}:1883:1883"

  api-server:
    environment:
      RMF_API_PUBLIC_URL: http://${RMF_BIND_IP:-10.8.0.1}:${RMF_API_PORT:-8010}
    volumes:
      # Task history and dashboard logins (sqlite, created at runtime) survive a recreate.
      - api-server-db:/ws/run
    ports: !override
      - "${RMF_BIND_IP:-10.8.0.1}:${RMF_API_PORT:-8010}:8000"

  dashboard:
    build:
      args:
        API_URL: http://${RMF_BIND_IP:-10.8.0.1}:${RMF_API_PORT:-8010}
        TRAJECTORY_URL: http://${RMF_BIND_IP:-10.8.0.1}:8006
        ISAACBOT_AMR_API_URL: http://${RMF_BIND_IP:-10.8.0.1}:8030
    ports: !override
      - "${RMF_BIND_IP:-10.8.0.1}:3000:3000"

  rmf:
    environment:
      RMF_BROKER_HOST: mosquitto
      RMF_BROKER_PORT: "1883"
      RMF_BROKER_USERNAME: rmf
      RMF_BROKER_PASSWORD: ${RMF_MQTT_PASSWORD:?run docker/rmf-server.sh init}
    ports: !override
      - "${RMF_BIND_IP:-10.8.0.1}:8006:8006"
      - "${RMF_BIND_IP:-10.8.0.1}:8030:8030"

  site-manager:
    environment:
      ISAACBOT_AMR_BROKER: mosquitto:1883
      BROKER_AUTH_DIR: /broker
      ROBOT_BROKER: ${RMF_BIND_IP:-10.8.0.1}:1883
      SITE_MANAGER_PASSWORD: ${SITE_MANAGER_PASSWORD:-}
      # The isaacbot-authorize command each robot page shows (run in src/isaacbot_amr_rmf).
      AUTHORIZE_CMD: docker/rmf-server.sh exec site-manager
      # The robots page's Network section: the host's name and addresses (rmf-server.sh).
      SERVER_HOSTNAME: ${SERVER_HOSTNAME:-}
      SERVER_VPN_IP: ${RMF_BIND_IP:-10.8.0.1}
      SERVER_LAN_IP: ${SERVER_LAN_IP:-}
    volumes:
      - broker-auth:/broker
    ports: !override
      - "${RMF_BIND_IP:-10.8.0.1}:8020:8020"

volumes:
  mosquitto-data:
  api-server-db:
  broker-auth:
