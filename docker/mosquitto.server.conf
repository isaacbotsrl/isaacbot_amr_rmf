# Fleet broker for the server deployment (docker-compose.server.yml): logins + ACL, retained
# messages (connection, factsheet) survive a restart. Reached over WireGuard only, no TLS.
listener 1883
allow_anonymous false
# The broker-auth volume: the RMF site manager adds and removes robot logins there, and
# mosquitto-run.sh makes Mosquitto reload them (SIGHUP).
password_file /mosquitto/auth/passwd
acl_file /mosquitto/auth/acl
persistence true
persistence_location /mosquitto/data/
log_dest stdout
# Also to the broker-auth volume: the site manager reads where each robot connects from (the
# robots page's Network section). mosquitto-run.sh rotates it.
log_dest file /mosquitto/auth/broker.log
